# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
com-alpsbte-canvas = "1.3" # https://mvn.alps-bte.com/#browse/browse:alps-bte:com%2Falpsbte%2Fcanvas
com-arcaniax-headdatabase-api = "1.+" # https://github.com/Arcaniax-Development/HeadDatabase-API/releases
com-github-cryptomorin-xseries = "13.+" # https://github.com/CryptoMorin/XSeries/releases
com-github-decentsoftware-eu-decentholograms = "2.9.9" # https://github.com/DecentSoftware-eu/DecentHolograms/releases 2.10+ require java 25 (MC 26.1+ mainly)
com-github-mwiede-jsch = "2.+" # https://github.com/mwiede/jsch/releases
com-squareup-okhttp3-okhttp-jvm = "5.+" # https://github.com/square/okhttp/tags
com-zaxxer-hikaricp = "7.+" # https://github.com/brettwooldridge/HikariCP/tags
commons-io-commons-io = "2.20.0" # Provided by Minecraft (Lib Folder)
commons-net-commons-net = "3.11.1"
de-oliver-fancynpcs = "2.4.2" # https://fancyspaces.net/spaces/fancynpcs/maven-repos/fi-releases/de.oliver:FancyNpcs # Outdated and broken AbstractNpc
io-papermc-paper-paper-api = "1.21.11-R0.1-SNAPSHOT"
org-apache-commons-commons-vfs2 = "2.10.0" # https://central.sonatype.com/artifact/org.apache.commons/commons-vfs2
org-hamcrest-hamcrest = "3.0" # https://central.sonatype.com/artifact/org.hamcrest/hamcrest
org-jetbrains-annotations = "26.+" # https://central.sonatype.com/artifact/org.jetbrains/annotations
org-junit-jupiter-junit-jupiter-engine = "5.+" # https://central.sonatype.com/artifact/org.junit.jupiter/junit-jupiter-engine
org-junit-platform-junit-platform-runner = "1.+" # https://central.sonatype.com/artifact/org.junit.platform/junit-platform-runner
org-mariadb-jdbc-mariadb-java-client = "3.+" # https://central.sonatype.com/artifact/org.mariadb.jdbc/mariadb-java-client
com-intellectualsites-bom-bom-newest = "1.55" # Ref: https://github.com/IntellectualSites/bom
lombok = "9.+" # https://github.com/freefair/gradle-plugins/releases
clipper2 = "1.+" # https://github.com/micycle1/Clipper2-java
configurate-yaml = "4.+" # https://github.com/SpongePowered/Configurate/releases
com-googlecode-json-simple = "1.1.1" # https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
org-slf4j-slf4j-api = "2.0.17"
org-json-json = "20251224"

[libraries]
com-alpsbte-canvas = { module = "com.alpsbte:canvas", version.ref = "com-alpsbte-canvas" }
com-arcaniax-headdatabase-api = { module = "com.arcaniax:HeadDatabase-API", version.ref = "com-arcaniax-headdatabase-api" }
